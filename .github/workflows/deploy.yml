name: Deploy

# Static SvelteKit build in web/, pushed to Cloudflare Pages via the org reusable deploy
# workflow. The data is committed (freeze-and-commit). CI re-runs the whole Python
# pipeline and refuses to deploy if the committed artifacts differ from what the pipeline
# produces. Cloudflare Git integration stays OFF; this main-only workflow is the only
# deploy path.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, with the tag in the trailing comment.
# Bump the SHA and the comment together.
jobs:
  verify:
    name: Pipeline is byte-stable and committed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Rebuild twice and run the tests (stdlib only)
        run: python -I -m unittest discover -s tests -v
      - name: Committed artifacts match the pipeline
        run: git diff --exit-code -- data build rules web/src/lib/data web/static/data web/static/rules

  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm --prefix web ci
      - name: Build the static site
        run: npm --prefix web run build
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/build

  # The project name is set to `payoutmath` explicitly, not taken from the repo name, so the
  # repo name never appears on the *.pages.dev URL. secrets: inherit passes the org-level
  # CLOUDFLARE_* secrets through.
  deploy:
    name: Deploy
    needs: [build]
    uses: lailarallc/reusable-workflows/.github/workflows/pages-deploy.yml@v1
    with:
      project_name: payoutmath
      artifact_name: site
    secrets: inherit

  # Idempotent custom-domain attach via the Cloudflare REST API (fleet pattern, recall-blast-radius
  # D-013: `wrangler pages domain` does not exist, and the CNAME is not auto-created). Non-fatal: if
  # the org token lacks Pages-domain or DNS scope, the site is still live on payoutmath.pages.dev.
  domain:
    name: Attach payoutmath.lailarallc.com
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Attach domain and CNAME if missing
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: payoutmath.lailarallc.com
          PROJECT: payoutmath
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          base="https://api.cloudflare.com/client/v4"
          if api "$base/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains" | grep -q "\"name\":\"$DOMAIN\""; then
            echo "domain already attached"
          else
            api -X POST "$base/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains" --data "{\"name\":\"$DOMAIN\"}" \
              | grep -q '"success":true' && echo "domain attached" || { echo "::warning::could not attach domain"; exit 1; }
          fi
          zone=$(api "$base/zones?name=lailarallc.com" | python3 -c 'import sys,json; r=json.load(sys.stdin)["result"]; print(r[0]["id"] if r else "")')
          [ -n "$zone" ] || { echo "::warning::zone not visible to token"; exit 1; }
          if api "$base/zones/$zone/dns_records?name=$DOMAIN" | grep -q "\"name\":\"$DOMAIN\""; then
            echo "dns record exists"
          else
            api -X POST "$base/zones/$zone/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"payoutmath\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" \
              | grep -q '"success":true' && echo "cname created" || { echo "::warning::could not create CNAME"; exit 1; }
          fi
